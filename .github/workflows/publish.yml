name: publish

# Publishes a tagged build to TestPyPI or PyPI with trusted publishing (OIDC),
# so no API token is stored in the repository.
#
# One-time setup by a human, for each index:
#   1. Add a pending trusted publisher at
#      https://pypi.org/manage/account/publishing/ (and the same page on
#      test.pypi.org) with:
#        owner: clevinson   repository: litschema   workflow: publish.yml
#        environment: pypi (on pypi.org) / testpypi (on test.pypi.org)
#   2. Create the `pypi` and `testpypi` environments in the repository settings.
#
# Dispatch it from the release tag, TestPyPI first. Restore a tag trigger once
# both indexes are set up (kata 0f2h).
on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads the version from tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Publishing an untested build is how a broken release reaches users who
      # cannot un-install it: PyPI does not allow re-uploading a version.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: The built version must be the tag
        run: |
          # Dispatched from a branch, hatch-vcs builds a dev version and
          # GITHUB_REF_NAME is the branch name. Say that instead of reporting a
          # version mismatch.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "run this workflow against a tag, not the $GITHUB_REF_TYPE '$GITHUB_REF_NAME'" >&2
            echo "re-run it and pick the release tag (for example v0.1.1) in the ref dropdown" >&2
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL=$(ls dist/*.whl)
          BUILT=$(basename "$WHEEL" | cut -d- -f2)
          if [ "$TAG" != "$BUILT" ]; then
            echo "tag $GITHUB_REF_NAME does not match built version $BUILT" >&2
            exit 1
          fi
          echo "tag and built version agree: $BUILT"

      - name: Import the public surface from the built wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" python -c "
          import litschema.cli, litschema.runs, litschema.reviews, litschema.analysis
          import litschema.explore.loader, litschema.webapp.app
          from litschema.cli import app
          print('ok')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.index }}
    permissions:
      id-token: write # trusted publishing; no token secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
