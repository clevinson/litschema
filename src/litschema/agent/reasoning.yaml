id: https://example.org/litschema/extraction-reasoning
name: litschema_extraction_reasoning
default_range: string

classes:
  ExtractionReasoning:
    description: Per-field evidence and reasoning for one extraction.
    tree_root: true
    attributes:
      confidence:
        description: >-
          Overall confidence in this extraction, 0.0-1.0. Summarizes how well the
          source supported the extracted values as a whole. Optional.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      confidence_reasoning:
        description: >-
          Short explanation of why the overall confidence score was assigned
          (e.g. sparse source, ambiguous reporting, well-structured methods).
          Optional.
      fields:
        description: Evidence entries for extracted non-identifier leaf fields.
        range: ReasoningField
        multivalued: true
        required: true

  ReasoningField:
    description: Evidence and explanation for one extracted field value.
    attributes:
      path:
        description: jq-style path to the extracted field, starting with a dot.
        required: true
      value:
        description: Extracted value rendered as text for cross-reference.
      source_lines:
        description: Markdown line references such as L23 or L23-L34,L55.
        required: true
      reasoning:
        description: Short explanation of why the cited lines support the value.
      confidence:
        description: >-
          Confidence in this single field's extracted value, 0.0-1.0. Optional;
          use it to flag fields that were inferred or weakly supported.
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
