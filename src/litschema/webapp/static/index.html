      } else if (currentStatus === "verified") {
        // Verified → flag dialog for row path
        const reviewer = $("#reviewer-id").value.trim();
        if (!reviewer) { alert("Please enter your ORCID in the toolbar before flagging."); return; }
        showFlagDialog(rowPath, state.annotations[rowPath]);
      } else {
        // Flagged → clear all child annotations
        for (const cp of cellPaths) {
          delete state.annotations[cp];
          fetch(`/api/annotations/${state.currentId}/${cp}`, { method: "DELETE" }).catch(() => {});
        }
        document.querySelectorAll(".flag-dialog").forEach(el => el.remove());
        renderExtractionPanel();
        updateStats();
      }
    });
  });
}

function selectTableRow(path, rangeIndex) {
  // Clear previous highlights including any horizontal table nav state
  resetAllSourceNavs();
  clearSearchFull();
  document.querySelectorAll("tr.selected").forEach(e => e.classList.remove("selected"));
  document.querySelectorAll(".cell-selected").forEach(e => e.classList.remove("cell-selected"));
  document.querySelectorAll(".reasoning-tooltip-row").forEach(e => e.remove());

  // Highlight the row
  const row = document.querySelector(`tr.clickable[data-path="${path}"]`);
  if (row) row.classList.add("selected");

  renderMarkdown();

  state.selectedPath = path;
  state.sections = [];
  state.sectionIndex = 0;

  const entry = state.reasoningByPath[path];
  if (!entry || !entry.source_lines) {
    $("#stat-citations").textContent = `${path}: no citation`;
    return;
  }

  const lineRanges = parseSourceLines(entry.source_lines);

  // If rangeIndex specified, only highlight that one range
  const rangesToHighlight = (typeof rangeIndex === "number") ? [lineRanges[rangeIndex]] : lineRanges;

  for (const [start, end] of rangesToHighlight) {
    let sectionFirstLine = null;
    for (let ln = start; ln <= end; ln++) {
      const lineEl = document.querySelector(`.md-line[data-line="${ln}"]`);
      if (lineEl) {
        lineEl.classList.add("reasoned-highlight");
        if (!sectionFirstLine) sectionFirstLine = lineEl;
      }
    }
    if (sectionFirstLine) {
      state.sections.push({
        firstLine: sectionFirstLine,
        label: start === end ? `L${start}` : `L${start}\u2013L${end}`,
      });
    }
  }

  // Show reasoning tooltip below the row (or after last row in rowspan group)
  if (entry.reasoning && row) {
    // Find the correct insertion point — if this row is part of a rowspan group,
    // insert after the last sibling that lacks a field cell (td:first-child with rowspan)
    let insertAfter = row;
    let sibling = row.nextElementSibling;
    while (sibling && sibling.matches("tr.clickable") && sibling.cells.length < 4) {
      insertAfter = sibling;
      sibling = sibling.nextElementSibling;
    }
    const tooltip = document.createElement("tr");
    tooltip.className = "reasoning-tooltip-row";
    tooltip.innerHTML = `<td colspan="4"><div class="reasoning-tooltip">${escapeHtml(entry.reasoning)}</div></td>`;
    insertAfter.after(tooltip);
  }

  if (state.sections.length > 0) {
    state.sections[0].firstLine.classList.add("active");
    state.sections[0].firstLine.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  let statusMsg = `${path}: ${entry.source_lines}`;
  if (entry.reasoning) statusMsg += ` \u2014 ${entry.reasoning}`;
  $("#stat-citations").textContent = statusMsg;
}

// selectHorizontalRow and selectHorizontalRowByPathAndRanges removed —
// replaced by sourceMap-based navigation in wireTableEvents

function buildTreeHtml(obj, path) {
  if (obj === null || obj === undefined) return "";

  if (Array.isArray(obj)) {
    if (obj.length === 0) return `<span class="tree-value">[]</span>`;
    let html = "";
    for (let i = 0; i < obj.length; i++) {
      const childPath = `${path}[${i}]`;
      const item = obj[i];
      if (typeof item === "object" && item !== null) {
        html += `<div class="tree-branch tree-node">
          <div class="tree-header"><span class="tree-toggle"></span>
          <span class="tree-key">[${i}]</span></div>
          <div class="tree-children">${buildTreeHtml(item, childPath)}</div></div>`;
      } else {
        html += buildLeafHtml(String(i), item, childPath);
      }
    }
    return html;
  }

  if (typeof obj === "object") {
    let html = "";
    for (const [key, val] of Object.entries(obj)) {
      const childPath = path ? `${path}.${key}` : key;
      if (!path && (key === "article_id" || key === "confidence" || key === "reasoning")) continue;

      if (val !== null && typeof val === "object") {
        const isEmpty = Array.isArray(val) ? val.length === 0 : Object.keys(val).length === 0;
        if (isEmpty) {
          html += `<div class="tree-node">
            <span class="tree-key">${key}:</span>
            <span class="tree-value">${Array.isArray(val) ? "[]" : "{}"}</span></div>`;
        } else {
          html += `<div class="tree-branch tree-node">
            <div class="tree-header"><span class="tree-toggle"></span>
            <span class="tree-key">${key}</span></div>
            <div class="tree-children">${buildTreeHtml(val, childPath)}</div></div>`;
        }
      } else {
        html += buildLeafHtml(key, val, childPath);
      }
    }
    return html;
  }

  return "";
}

function buildLeafHtml(key, value, path) {
  const showIndicator = value !== null && typeof value !== "boolean";

  const entry = state.reasoningByPath[path];
  const ann = state.annotations[path];
  const annStatus = ann ? ann.status : "";

  // Source lines (clickable)
  let sourceHtml = "";
  if (entry && entry.source_lines) {
    sourceHtml = `<span class="match-nav source-link" data-path="${path}">${entry.source_lines}</span>`;
  }

  // Single cycling annotation button (matches table view: ○ → ✓ → ⚑ → ○)
  let annClass = "", annIcon = "&#9675;", annTitle = "Click to verify";
  if (annStatus === "verified") { annClass = " ann-verified"; annIcon = "&#10003;"; annTitle = "Verified — click to flag"; }
  else if (annStatus === "flagged") { annClass = " ann-flagged"; annIcon = "&#9873;"; annTitle = "Flagged — click to clear"; }
  const annBtn = `<span class="ann-btn tree-ann-btn${annClass}" data-path="${path}" title="${annTitle}">${annIcon}</span>`;

  // Indicator dot
  let indicatorClass = "uncited";
  if (entry) indicatorClass = "reasoned";
  if (annStatus === "verified") indicatorClass = "verified";
  else if (annStatus === "flagged") indicatorClass = "flagged";

  // Flag details
  let flagDetails = "";
  if (annStatus === "flagged" && ann) {
    if (ann.correct_value) flagDetails += `<div class="flag-correction" style="margin-left:24px">→ ${escapeHtml(ann.correct_value)}</div>`;
    if (ann.note) flagDetails += `<div class="flag-note-display" style="margin-left:24px">${escapeHtml(ann.note)}</div>`;
  }

  let valClass = "string";
  if (typeof value === "number") valClass = "number";
  else if (value === null) valClass = "";

  const displayVal = value === null ? "null" : typeof value === "string" ? `"${value}"` : String(value);

  return `<div class="tree-node tree-leaf" data-path="${path}">
    ${showIndicator ? `<span class="indicator ${indicatorClass}"></span>` : ""}
    <span class="tree-key">${key}:</span>
    <span class="tree-value ${valClass}">${escapeHtml(displayVal)}</span>
    ${sourceHtml}
    ${annBtn}
  </div>${flagDetails}`;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
}

// ── Leaf selection & highlighting ──
function selectLeaf(el) {
  const path = el.dataset.path;

  // Clear any active search
  clearSearchFull();

  document.querySelectorAll(".tree-leaf.selected").forEach(e => e.classList.remove("selected"));
  document.querySelectorAll(".reasoning-tooltip").forEach(e => e.remove());
  document.querySelectorAll(".section-nav").forEach(e => e.remove());
  el.classList.add("selected");

  renderMarkdown();

  state.selectedPath = path;
  state.sections = [];
  state.sectionIndex = 0;

  const entry = state.reasoningByPath[path];
  if (!entry || !entry.source_lines) {
    $("#stat-citations").textContent = `${path}: no citation`;
    return;
  }

  const lineRanges = parseSourceLines(entry.source_lines);

  for (const [start, end] of lineRanges) {
    let sectionFirstLine = null;
    for (let ln = start; ln <= end; ln++) {
      const lineEl = document.querySelector(`.md-line[data-line="${ln}"]`);
      if (lineEl) {
        lineEl.classList.add("reasoned-highlight");
        if (!sectionFirstLine) sectionFirstLine = lineEl;
      }
    }
    if (sectionFirstLine) {
      state.sections.push({
        firstLine: sectionFirstLine,
        label: start === end ? `L${start}` : `L${start}\u2013L${end}`,
      });
    }
  }

  if (entry.reasoning) {
    const tooltip = document.createElement("div");
    tooltip.className = "reasoning-tooltip";
    tooltip.textContent = entry.reasoning;
    el.after(tooltip);
  }

  let statusMsg = `${path}: ${entry.source_lines}`;
  if (entry.reasoning) statusMsg += ` \u2014 ${entry.reasoning}`;
  $("#stat-citations").textContent = statusMsg;

  if (state.sections.length > 1) {
    const nav = document.createElement("span");
    nav.className = "section-nav";
    nav.innerHTML = `<button class="nav-prev">\u25C0</button>` +
      `<span class="section-counter">1/${state.sections.length}</span>` +
      `<button class="nav-next">\u25B6</button>`;
    el.appendChild(nav);

    nav.querySelector(".nav-prev").addEventListener("click", (e) => {
      e.stopPropagation();
      state.sectionIndex = (state.sectionIndex - 1 + state.sections.length) % state.sections.length;
      scrollToSection();
    });
    nav.querySelector(".nav-next").addEventListener("click", (e) => {
      e.stopPropagation();
      state.sectionIndex = (state.sectionIndex + 1) % state.sections.length;
      scrollToSection();
    });
  }

  if (state.sections.length > 0) scrollToSection();
}

function scrollToSection() {
  document.querySelectorAll(".md-line.active").forEach(e => e.classList.remove("active"));

  const section = state.sections[state.sectionIndex];
  section.firstLine.classList.add("active");
  section.firstLine.scrollIntoView({ behavior: "smooth", block: "center" });

  const counter = document.querySelector(".section-nav .section-counter");
  if (counter) counter.textContent = `${state.sectionIndex + 1}/${state.sections.length}`;

  const path = state.selectedPath;
  const entry = state.reasoningByPath[path];
  let msg = `${path}: ${state.sectionIndex + 1}/${state.sections.length} (${section.label})`;
  if (entry && entry.reasoning) msg += ` \u2014 ${entry.reasoning}`;
  $("#stat-citations").textContent = msg;
}

function parseSourceLines(str) {
  const ranges = [];
  for (const part of str.split(",")) {
    const trimmed = part.trim().replace(/^L/i, "");
    if (trimmed.includes("-")) {
      const [a, b] = trimmed.split("-").map(s => parseInt(s.replace(/^L/i, ""), 10));
      if (!isNaN(a) && !isNaN(b)) ranges.push([a, b]);
    } else {
      const n = parseInt(trimmed, 10);
      if (!isNaN(n)) ranges.push([n, n]);
    }
  }
  return ranges;
}

function activateMatch(index, matches) {
  document.querySelectorAll(".md-line.active").forEach(e => e.classList.remove("active"));

  const m = matches[index];
  const lineEl = document.querySelector(`.md-line[data-line="${m.line}"]`);
  if (lineEl) {
    lineEl.classList.add("active");
    lineEl.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

// ── Keyboard navigation ──
document.addEventListener("keydown", (e) => {
  // Cmd+] / Cmd+[ to cycle articles (Cmd+J/K reserved by browsers)
  if (e.metaKey && !e.ctrlKey && !e.altKey && (e.key === "]" || e.key === "[")) {
    e.preventDefault();
    e.stopPropagation();
    if (document.activeElement) document.activeElement.blur();
    setTimeout(() => navigateArticle(e.key === "]" ? 1 : -1), 0);
    return;
  }

  // Section navigation (when a field is selected)
  if (!state.selectedPath || state.sections.length < 2) return;
  if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "SELECT") return;

  if ((e.key === "n" || e.key === "ArrowRight") && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    state.sectionIndex = (state.sectionIndex + 1) % state.sections.length;
    scrollToSection();
  }
  if ((e.key === "p" || e.key === "ArrowLeft") && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    state.sectionIndex = (state.sectionIndex - 1 + state.sections.length) % state.sections.length;
    scrollToSection();
  }
});

// ── Search ──
function doSearch() {
  const query = $("#search-box").value.trim();
  if (!query || !state.markdown) return;

  // Show clear button
  $("#search-clear").style.display = "flex";

  // Reset markdown highlights
  renderMarkdown();
  state.selectedPath = null;

  const lines = state.markdown.split("\n");
  state.searchMatches = [];
  const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");

  for (let i = 0; i < lines.length; i++) {
    if (re.test(lines[i])) {
      state.searchMatches.push(i + 1);
      const lineEl = document.querySelector(`.md-line[data-line="${i + 1}"]`);
      if (lineEl) lineEl.classList.add("highlighted");
    }
  }

  state.searchIndex = 0;
  if (state.searchMatches.length > 0) {
    scrollToSearchMatch(0);
  }
  updateSearchNav();
}

function scrollToSearchMatch(index) {
  document.querySelectorAll(".md-line.active").forEach(e => e.classList.remove("active"));
  state.searchIndex = index;
  const lineNum = state.searchMatches[index];
  const lineEl = document.querySelector(`.md-line[data-line="${lineNum}"]`);
  if (lineEl) {
    lineEl.classList.add("active");
    lineEl.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  updateSearchNav();
}

function navigateSearch(direction) {
  if (state.searchMatches.length === 0) return;
  const next = (state.searchIndex + direction + state.searchMatches.length) % state.searchMatches.length;
  scrollToSearchMatch(next);
}

function updateSearchNav() {
  const resultsEl = $("#search-results");
  if (state.searchMatches.length > 0) {
    resultsEl.style.display = "flex";
    $("#search-counter").textContent = `${state.searchIndex + 1}/${state.searchMatches.length}`;
  } else {
    resultsEl.style.display = "none";
  }
}

function clearSearch() {
  state.searchMatches = [];
  state.searchIndex = 0;
  state._lastQuery = "";
  $("#search-results").style.display = "none";
  $("#search-clear").style.display = "none";
}

function clearSearchFull() {
  clearSearch();
  $("#search-box").value = "";
  if (state.markdown) renderMarkdown();
}

// Wire up the integrated search controls
$("#search-prev").addEventListener("click", () => navigateSearch(-1));
$("#search-next").addEventListener("click", () => navigateSearch(1));
$("#search-clear").addEventListener("click", () => {
  clearSearchFull();
  $("#search-box").focus();
});

$("#search-box").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    if (e.shiftKey) {
      navigateSearch(-1);
    } else if (state.searchMatches.length > 0 && $("#search-box").value.trim() === state._lastQuery) {
      navigateSearch(1);
    } else {
      state._lastQuery = $("#search-box").value.trim();
      doSearch();
    }
    e.preventDefault();
  } else if (e.key === "Escape") {
    clearSearch();
    renderMarkdown();
    $("#search-box").blur();
  } else if (e.key === "ArrowDown" && state.searchMatches.length > 0) {
    e.preventDefault(); navigateSearch(1);
  } else if (e.key === "ArrowUp" && state.searchMatches.length > 0) {
    e.preventDefault(); navigateSearch(-1);
  }
});

// ── PDF button ──
$("#btn-pdf").addEventListener("click", () => {
  if (!state.currentId) return;
  const meta = state.articles.find(a => a.article_id === state.currentId);
  // Static deploy (no server) uses DOI; local uses PDF API
  const isStatic = location.protocol === "file:" || !location.origin.includes("localhost");
  if (isStatic && meta && meta.doi) {
    window.open(`https://doi.org/${meta.doi}`, "_blank");
  } else {
    window.open(`/api/pdf/${state.currentId}`, "_blank");
  }
});

// ── Stats ──
function updateStats() {
  const reasoned = Object.keys(state.reasoningByPath).length;
  const uncited = document.querySelectorAll(".indicator.uncited").length;
  const total = reasoned + uncited;
  const nVerified = Object.values(state.annotations).filter(a => a.status === "verified").length;
  const nFlagged = Object.values(state.annotations).filter(a => a.status === "flagged").length;
  let msg = `${reasoned}/${total} cited`;
  if (nVerified > 0 || nFlagged > 0) {
    msg += ` \u00b7 ${nVerified} verified`;
    if (nFlagged > 0) msg += `, ${nFlagged} flagged`;
  }
  $("#stat-citations").textContent = msg;
}

// ── Annotations ──
async function handleAnnotation(path, status) {
  const reviewer = $("#reviewer-id").value.trim();
  const existing = state.annotations[path];

  // Toggle off if clicking same status
  if (existing && existing.status === status) {
    delete state.annotations[path];
    await fetch(`/api/annotations/${state.currentId}/${path}`, { method: "DELETE" }).catch(() => {});
    renderExtractionPanel();
    updateStats();
    return;
  }

  // Verified: save immediately (no dialog)
  if (status === "verified") {
    const entry = { path: "." + path, status, reviewer };
    state.annotations[path] = entry;
    await fetch(`/api/annotations/${state.currentId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry),
    }).catch(() => {});
    renderExtractionPanel();
    updateStats();
    return;
  }

  // Flagged: show inline dialog for correct_value + note
  if (status === "flagged") {
    if (!reviewer) {
      alert("Please enter your ORCID in the toolbar before flagging.");
      return;
    }
    showFlagDialog(path, existing);
  }
}

function showFlagDialog(path, existing) {
  // Remove any existing flag dialog
  document.querySelectorAll(".flag-dialog").forEach(el => el.remove());

  // Find the row/element to insert after
  let anchor = document.querySelector(`[data-path="${path}"]`);
  if (!anchor) return;

  const currentValue = getValueAtPath(state.extraction, path);
  const prevCorrect = existing ? (existing.correct_value || "") : "";
  const prevNote = existing ? (existing.note || "") : "";

  const dialogHtml = `
    <div class="flag-form">
      <div class="flag-form-header">
        <span class="flag-form-path">${path}</span>
        <span class="flag-form-current">Current: <strong>${escapeHtml(String(currentValue ?? "null"))}</strong></span>
      </div>
      <div class="flag-form-fields">
        <label>
          <span>Correct value</span>
          <input type="text" class="flag-input" id="flag-correct" value="${escapeHtml(prevCorrect)}" placeholder="Enter correct value, or &quot;__remove__&quot; if field should not exist">
        </label>
        <label>
          <span>Note</span>
          <textarea class="flag-textarea" id="flag-note" rows="2" placeholder="Describe the error or uncertainty...">${escapeHtml(prevNote)}</textarea>
        </label>
      </div>
      <div class="flag-form-actions">
        <button class="flag-save" id="flag-save-btn">Save Flag</button>
        <button class="flag-cancel" id="flag-cancel-btn">Cancel</button>
      </div>
    </div>`;

  const row = anchor.closest("tr");
  const treeLeaf = anchor.closest(".tree-leaf");
  let dialog;

  if (row) {
    // Table view: overlay positioned below row
    const section = row.closest(".ext-section") || row.closest(".table-view");
    if (!section) return;
    section.style.position = "relative";
    dialog = document.createElement("div");
    dialog.className = "flag-dialog";
    const rowRect = row.getBoundingClientRect();
    const sectionRect = section.getBoundingClientRect();
    dialog.style.top = (rowRect.bottom - sectionRect.top) + "px";
    dialog.innerHTML = dialogHtml;
    section.appendChild(dialog);
  } else if (treeLeaf) {
    // JSON tree view: insert inline after the leaf
    dialog = document.createElement("div");
    dialog.className = "flag-dialog flag-dialog-inline";
    dialog.innerHTML = dialogHtml;
    treeLeaf.after(dialog);
  } else {
    return;
  }

  // Focus the correct value input
  dialog.querySelector("#flag-correct").focus();

  dialog.querySelector("#flag-save-btn").addEventListener("click", async () => {
    const correctValue = dialog.querySelector("#flag-correct").value.trim();
    const note = dialog.querySelector("#flag-note").value.trim();
    const reviewer = $("#reviewer-id").value.trim();

    const entry = { path: "." + path, status: "flagged", reviewer };
    if (correctValue) entry.correct_value = correctValue;
    if (note) entry.note = note;

    state.annotations[path] = entry;
    await fetch(`/api/annotations/${state.currentId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry),
    }).catch(() => {});

    dialog.remove();
    renderExtractionPanel();
    updateStats();
  });

  dialog.querySelector("#flag-cancel-btn").addEventListener("click", () => {
    // Revert to verified (since we set flagged before opening)
    const reviewer = $("#reviewer-id").value.trim();
    const revertEntry = { path: "." + path, status: "verified", reviewer };
    state.annotations[path] = revertEntry;
    fetch(`/api/annotations/${state.currentId}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(revertEntry),
    }).catch(() => {});
    dialog.remove();
    renderExtractionPanel();
    updateStats();
  });

  // Enter in input saves, Escape cancels
  dialog.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { dialog.querySelector("#flag-cancel-btn").click(); }
    if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
      e.preventDefault();
      dialog.querySelector("#flag-save-btn").click();
    }
  });
}

function getValueAtPath(obj, path) {
  const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
  let current = obj;
  for (const part of parts) {
    if (current === null || current === undefined) return null;
    current = current[part];
  }
  return current;
}

  } else if (e.target.id === "btn-pivot-view") {
    state.viewMode = "table";
    state.tableMode = "pivot";
    localStorage.setItem("erw-view-mode", "table");
    localStorage.setItem("erw-table-mode", "pivot");
    resetAllSourceNavs();
    renderExtractionPanel();
  } else if (e.target.id === "btn-json-view") {
    state.viewMode = "json";
    localStorage.setItem("erw-view-mode", "json");
    resetAllSourceNavs();
    renderExtractionPanel();
  }
});

// ── Boot ──
init();
</script>
</body>
</html>
